<svg width="850" height="400" viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="850" height="400" fill="#ffffff" />
  
  <!-- Definitions for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#333333" />
    </marker>
  </defs>

  <!-- Bold & Two-Row Styles -->
  <style>
    .node { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .label { font-family: 'Times New Roman', Times, serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #000000; text-transform: uppercase; letter-spacing: 0.2px; }
    .arrow { stroke: #333333; stroke-width: 1.5; fill: none; }
  </style>

  <!-- ROW 1 -->
  <!-- Node 1 -->
  <rect x="20" y="40" width="180" height="100" class="node" />
  <text x="110" y="80" class="label">Energy Dataset /</text>
  <text x="110" y="100" class="label">Telemetry Input</text>

  <!-- Arrow 1-2 -->
  <line x1="200" y1="90" x2="212" y2="90" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 2 -->
  <rect x="220" y="40" width="180" height="100" class="node" />
  <text x="310" y="80" class="label">Web Dashboard</text>
  <text x="310" y="100" class="label">(Admin / Resident)</text>

  <!-- Arrow 2-3 -->
  <line x1="400" y1="90" x2="412" y2="90" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 3 -->
  <rect x="420" y="40" width="180" height="100" class="node" />
  <text x="510" y="90" class="label">Flask Backend Server</text>

  <!-- Arrow 3-4 -->
  <line x1="600" y1="90" x2="612" y2="90" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 4 -->
  <rect x="620" y="40" width="180" height="100" class="node" />
  <text x="710" y="80" class="label">Data Preprocessing</text>
  <text x="710" y="100" class="label">(Pandas, NumPy)</text>


  <!-- CONNECTION FROM ROW 1 TO ROW 2 -->
  <path d="M 800 90 L 820 90 L 820 180 L 30 180 L 30 270 L 42 270" class="arrow" marker-end="url(#arrowhead)" fill="none" />


  <!-- ROW 2 -->
  <!-- Node 5 -->
  <rect x="50" y="220" width="180" height="100" class="node" />
  <text x="140" y="260" class="label">DRL Optimization</text>
  <text x="140" y="280" class="label">Engine (DQN + PPO)</text>

  <!-- Arrow 5-6 -->
  <line x1="230" y1="270" x2="242" y2="270" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 6 -->
  <rect x="250" y="220" width="180" height="100" class="node" />
  <text x="340" y="260" class="label">Energy Dispatch</text>
  <text x="340" y="280" class="label">(Solar / Battery / Grid)</text>

  <!-- Arrow 6-7 -->
  <line x1="430" y1="270" x2="442" y2="270" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 7 -->
  <rect x="450" y="220" width="180" height="100" class="node" />
  <text x="540" y="260" class="label">MongoDB</text>
  <text x="540" y="280" class="label">Database Storage</text>

  <!-- Arrow 7-8 -->
  <line x1="630" y1="270" x2="642" y2="270" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Node 8 -->
  <rect x="650" y="220" width="180" height="100" class="node" />
  <text x="740" y="260" class="label">Visualization & AI</text>
  <text x="740" y="280" class="label">(Insights + Reports)</text>

</svg>
