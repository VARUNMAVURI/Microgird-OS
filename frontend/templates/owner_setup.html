{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <!-- Animated Blobs -->
    <div class="login-blob"></div>
    <div class="login-blob"></div>

    <div class="login-glass-card">
        <div class="login-brand-header">
            <i class="fas fa-tachometer-alt"
                style="font-size: 2.2rem; color: var(--neon-yellow); margin-bottom: 15px; filter: drop-shadow(var(--glow-yellow));"></i>
            <h1 style="letter-spacing: 1px;">METER SETUP</h1>
            <p
                style="font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: var(--neon-blue);">
                Link Your Energy Node</p>
        </div>

        <form id="setup-form" onsubmit="handleSetup(event)">
            <div class="login-input-group">
                <label>Enter Electricity Consumer Number</label>
                <div style="position: relative;">
                    <i class="fas fa-hashtag"
                        style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="text" id="consumer_number" class="login-modern-input" placeholder="e.g. 100001"
                        maxlength="12" style="padding-left: 48px; width: 100%; box-sizing: border-box; font-family: var(--font-mono); letter-spacing: 2px;" 
                        oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                </div>
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; line-height: 1.4;">
                    <i class="fas fa-info-circle" style="color: var(--neon-blue); margin-right: 4px;"></i>
                    Enter your 6–12 digit meter number to load your personalized dashboard.
                </p>
            </div>

            <button type="submit" id="submit-btn" class="login-action-btn" style="margin-top: 24px;">
                LOAD MY ENERGY DASHBOARD <i class="fas fa-chart-line" style="margin-left: 8px;"></i>
            </button>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" onclick="window.location.href='/switch_to_admin'" class="login-action-btn" style="flex: 1; background: rgba(0,180,255,0.1); border: 1px solid rgba(0,180,255,0.3); color: var(--neon-blue); font-size: 0.8rem;">
                    <i class="fas fa-users-cog"></i> SWITCH ROLE
                </button>
                <button type="button" onclick="logout()" class="login-action-btn" style="flex: 1; background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #ff5252; font-size: 0.8rem;">
                    <i class="fas fa-sign-out-alt"></i> LOGOUT
                </button>
            </div>

            <div id="status-msg" class="login-status-msg"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function setStatus(msg, type = 'info') {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.className = 'login-status-msg ' + type;
    }

    async function handleSetup(e) {
        e.preventDefault();
        const consumer_number = document.getElementById('consumer_number').value.trim();
        const btn = document.getElementById('submit-btn');

        if (!/^\d{6,12}$/.test(consumer_number)) {
            setStatus("❌ Consumer number must be 6–12 digits.", "error");
            return;
        }

        setStatus('');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LINKING METER...';

        try {
            const res = await fetch('/api/owner/setup', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ consumer_number })
            });
            const data = await res.json();

            if (data.success) {
                setStatus("✅ Meter Linked! Redirecting...", "success");
                window.location.href = data.redirect;
            } else {
                setStatus("❌ " + data.message, "error");
                btn.innerHTML = 'LOAD MY ENERGY DASHBOARD <i class="fas fa-chart-line" style="margin-left: 8px;"></i>';
                btn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            setStatus("❌ Connection Error", "error");
            btn.disabled = false;
            btn.innerHTML = 'RETRY';
        }
    }

    async function logout() {
        try {
            const res = await fetch('/api/logout', { 
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect;
            }
        } catch (err) {
            console.error(err);
            window.location.href = '/';
        }
    }
</script>
{% endblock %}
